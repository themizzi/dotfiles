name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_startup:
        description: 'Also test real plugin bootstrap (network required)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install system test tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install stow zsh ripgrep fzf shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y stow zsh ripgrep fzf shellcheck
          fi
      - name: Install checksum-verified Neovim and just
        run: python3 -B .github/workflows/install-tools.py
      - name: Run pinned installer tests before creating a venv
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Prefer system Bash 3.2 and BSD utilities, retaining Homebrew Stow.
            PATH="/bin:/usr/bin:/usr/sbin:/sbin:$(brew --prefix)/bin" sh scripts/test-installer.sh
          else
            sh scripts/test-installer.sh
          fi
      - name: Install locked Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-test.txt
          .venv/bin/python -m pip check
      # PR7 is stacked after PR2: these recipes are the public validation contract.
      - name: Check and run complete offline suite
        run: |
          nvim --version
          just --version
          just check
          just lint
          just fmt-check
          just test

  distributions:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:13
          - name: Fedora
            image: fedora:43
          - name: Arch
            image: archlinux:base
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Provision container (before checkout needs git and CA certificates)
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates git python3 python3-venv stow zsh ripgrep fzf shellcheck
          elif command -v dnf >/dev/null; then
            dnf install -y ca-certificates git python3 python3-pip stow zsh ripgrep fzf tar gzip ShellCheck
          else
            pacman -Syu --noconfirm --needed ca-certificates git python python-pip stow zsh ripgrep fzf tar gzip shellcheck
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install checksum-verified Neovim and just
        run: python3 -B .github/workflows/install-tools.py
      - name: Run pinned installer tests before creating a venv
        run: sh scripts/test-installer.sh
      - name: Install locked Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-test.txt
          .venv/bin/python -m pip check
      - name: Check and run complete offline suite (no distribution skips)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 --version
          nvim --version
          just --version
          just check
          just lint
          just fmt-check
          just test

  plugin-startup:
    name: Opt-in real plugin startup
    if: github.event_name == 'workflow_dispatch' && inputs.plugin_startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fzf
      - run: python3 -B .github/workflows/install-tools.py
      - name: Bootstrap real plugins and verify second startup
        run: python3 -B .github/workflows/plugin-smoke.py
